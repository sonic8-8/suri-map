spring:
  application:
    name: suri-map-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/surimap}
    username: ${SPRING_DATASOURCE_USERNAME:surimap}
    password: ${SPRING_DATASOURCE_PASSWORD:surimap}
  flyway:
    enabled: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.surimap.config.mybatis
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

mock112:
  enabled: ${MOCK_112_ENABLED:true}
  base-url: ${MOCK_112_BASE_URL:http://localhost:18112}
  polling:
    interval-ms: ${MOCK_112_POLLING_INTERVAL:5000}

tileserver:
  mode: ${TILESERVER_MODE:fixture}
  base-url: ${TILESERVER_BASE_URL:http://tileserver-gl:8080}
