spring:
  application:
    name: suri-map-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/surimap}
    username: ${SPRING_DATASOURCE_USERNAME:surimap}
    password: ${SPRING_DATASOURCE_PASSWORD:surimap}
  flyway:
    enabled: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.surimap.config.mybatis
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: ${SERVER_PORT:8080}

surimap:
  cors:
    allowed-origin-patterns: ${SURI_MAP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://k14c106.p.ssafy.io}
  auth:
    keycloak:
      issuer-uri: ${SURI_MAP_KEYCLOAK_ISSUER_URI:https://k14c106.p.ssafy.io/keycloak/realms/suri-map}
      jwk-set-uri: ${SURI_MAP_KEYCLOAK_JWK_SET_URI:https://k14c106.p.ssafy.io/keycloak/realms/suri-map/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

mock112:
  enabled: ${MOCK_112_ENABLED:true}
  base-url: ${MOCK_112_BASE_URL:http://localhost:18112}
  internal-api:
    token: ${MOCK112_INTERNAL_API_TOKEN:}
  webhook:
    secret: ${MOCK112_WEBHOOK_SECRET:}
  polling:
    interval-ms: ${MOCK_112_POLLING_INTERVAL:5000}

tileserver:
  mode: ${TILESERVER_MODE:tileserver-gl}
  base-url: ${TILESERVER_BASE_URL:http://localhost:8082}

fcm:
  provider: ${FCM_PROVIDER:mock}
  firebase:
    credentials-location: ${FIREBASE_CREDENTIALS_LOCATION:}
    credentials-json-base64: ${FIREBASE_CREDENTIALS_JSON_BASE64:}
    project-id: ${FIREBASE_PROJECT_ID:}
    dry-run: ${FIREBASE_FCM_DRY_RUN:false}
