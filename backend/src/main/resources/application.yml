spring:
  application:
    name: suri-map-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/surimap}
    username: ${SPRING_DATASOURCE_USERNAME:surimap}
    password: ${SPRING_DATASOURCE_PASSWORD:surimap}
  flyway:
    enabled: true

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.surimap.config.mybatis
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

server:
  port: ${SERVER_PORT:8080}

surimap:
  cors:
    allowed-origin-patterns: ${SURI_MAP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,https://k14c106.p.ssafy.io}
  auth:
    keycloak:
      issuer-uri: ${SURI_MAP_KEYCLOAK_ISSUER_URI:http://localhost:5174/keycloak/realms/suri-map}
      jwk-set-uri: ${SURI_MAP_KEYCLOAK_JWK_SET_URI:http://localhost:5174/keycloak/realms/suri-map/protocol/openid-connect/certs}
  object-storage:
    provider: ${SURI_MAP_OBJECT_STORAGE_PROVIDER:mock}
    endpoint: ${SURI_MAP_OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    public-endpoint: ${SURI_MAP_OBJECT_STORAGE_PUBLIC_ENDPOINT:}
    bucket: ${SURI_MAP_OBJECT_STORAGE_BUCKET:suri-map-photo}
    access-key: ${SURI_MAP_OBJECT_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${SURI_MAP_OBJECT_STORAGE_SECRET_KEY:minioadmin}
    region: ${SURI_MAP_OBJECT_STORAGE_REGION:us-east-1}
  ai:
    openai:
      enabled: ${SURI_MAP_OPENAI_ENABLED:false}
      base-url: ${SURI_MAP_OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${SURI_MAP_OPENAI_API_KEY:${OPENAI_API_KEY:}}
      model: ${SURI_MAP_OPENAI_MODEL:gpt-5-mini}
      timeout-ms: ${SURI_MAP_OPENAI_TIMEOUT_MS:15000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

mock112:
  enabled: ${MOCK_112_ENABLED:true}
  base-url: ${MOCK_112_BASE_URL:http://localhost:18112}
  internal-api:
    token: ${MOCK112_INTERNAL_API_TOKEN:}
  webhook:
    secret: ${MOCK112_WEBHOOK_SECRET:}
  polling:
    interval-ms: ${MOCK_112_POLLING_INTERVAL:5000}

tileserver:
  mode: ${TILESERVER_MODE:tileserver-gl}
  base-url: ${TILESERVER_BASE_URL:http://localhost:8082}

fcm:
  provider: ${FCM_PROVIDER:mock}
  firebase:
    credentials-location: ${FIREBASE_CREDENTIALS_LOCATION:}
    credentials-json-base64: ${FIREBASE_CREDENTIALS_JSON_BASE64:}
    project-id: ${FIREBASE_PROJECT_ID:}
    dry-run: ${FIREBASE_FCM_DRY_RUN:false}
