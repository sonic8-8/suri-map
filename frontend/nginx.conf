# Keep this port private; host nginx must overwrite these headers with the external request's values.
map $http_x_forwarded_proto $original_request_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_x_forwarded_port $original_request_port {
    default $http_x_forwarded_port;
    "" $server_port;
}

# Docker DNS; cache answers for 5s (not a recovery-time guarantee).
# Dynamic upstream resolution requires nginx >= 1.27.3 and shared zones.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend:8080 resolve;
}

upstream object_storage {
    zone object_storage 64k;
    server object-storage:9000 resolve;
}

upstream mock112 {
    zone mock112 64k;
    server mock-112:18112 resolve;
}

upstream keycloak {
    zone keycloak 64k;
    server keycloak:8080 resolve;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $original_request_proto;
        proxy_set_header X-Forwarded-Port $original_request_port;
        proxy_set_header Forwarded "";
    }

    location = /suri-map-photo {
        return 308 /suri-map-photo/;
    }

    location /suri-map-photo/ {
        proxy_pass http://object_storage;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location = /tiles {
        return 308 /tiles/;
    }

    location /tiles/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $original_request_proto;
        proxy_set_header X-Forwarded-Port $original_request_port;
        proxy_set_header Forwarded "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Client-Channel $http_x_client_channel;
        proxy_set_header X-PolicePhone-Id $http_x_policephone_id;
    }

    location = /mock-112 {
        return 308 /mock-112/;
    }

    location /mock-112/ {
        set $mock112_forwarded_proto $http_x_forwarded_proto;
        if ($mock112_forwarded_proto = "") {
            set $mock112_forwarded_proto $scheme;
        }

        set $mock112_forwarded_port $http_x_forwarded_port;
        if ($mock112_forwarded_port = "") {
            set $mock112_forwarded_port $server_port;
        }

        proxy_pass http://mock112;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $mock112_forwarded_proto;
        proxy_set_header X-Forwarded-Port $mock112_forwarded_port;
    }

    location = /keycloak {
        return 308 /keycloak/;
    }

    location /keycloak/ {
        set $keycloak_forwarded_proto $http_x_forwarded_proto;
        if ($keycloak_forwarded_proto = "") {
            set $keycloak_forwarded_proto $scheme;
        }

        set $keycloak_forwarded_port $http_x_forwarded_port;
        if ($keycloak_forwarded_port = "") {
            set $keycloak_forwarded_port $server_port;
        }

        proxy_pass http://keycloak;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $keycloak_forwarded_proto;
        proxy_set_header X-Forwarded-Port $keycloak_forwarded_port;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
