<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Search</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--gov-font-body); color: var(--gov-fg-1); }
  .search { display:flex; align-items:stretch; max-width: 640px; }
  .search input { flex: 1; height: 56px; border: 2px solid var(--gov-fg-1); border-right: 0; border-radius: 8px 0 0 8px; padding: 0 20px; font-size: 19px; font-family: inherit; outline: none; }
  .search button { height: 56px; padding: 0 24px; background: var(--gov-fg-1); color:#fff; border:0; border-radius: 0 8px 8px 0; font-size: 17px; font-family: inherit; cursor:pointer; display:flex; align-items:center; gap: 8px; }
  .keys { margin-top: 16px; font-size: 15px; color: var(--gov-fg-3); display:flex; gap: 12px; flex-wrap:wrap; align-items:center; }
  .chip { padding: 6px 14px; border:1px solid var(--gov-border-2); border-radius: 999px; color: var(--gov-fg-1); cursor:pointer; }
  .chip:hover { background: var(--gov-primary-pastel); border-color: var(--gov-primary); color: var(--gov-primary); }
</style></head>
<body>
<div class="search">
  <input placeholder="검색어를 입력하세요">
  <button>🔍 검색</button>
</div>
<div class="keys">
  <span style="color:var(--gov-fg-1);font-weight:700">인기검색어</span>
  <span class="chip">전입신고</span><span class="chip">주민등록등본</span><span class="chip">건강보험</span><span class="chip">국세납부</span>
</div>
</body></html>
