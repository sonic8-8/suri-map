<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--gov-font-display); color: var(--gov-fg-1); }
  .row { display:flex; flex-direction:column; gap: 14px; }
  .item { display:flex; align-items:baseline; gap: 16px; }
  .label { font-family: var(--gov-font-mono); font-size: 11px; color: var(--gov-fg-3); width: 110px; flex-shrink: 0; }
  .sample { font-family: var(--gov-font-display); font-weight: 700; line-height: 1.05; }
</style></head>
<body>
<div class="row">
  <div class="item"><span class="label">display-m / 40</span><span class="sample" style="font-size:40px">표준 프로토타입</span></div>
  <div class="item"><span class="label">h1 / 32</span><span class="sample" style="font-size:32px;font-family:var(--gov-font-body)">정책뉴스</span></div>
  <div class="item"><span class="label">h2 / 25</span><span class="sample" style="font-size:25px;font-family:var(--gov-font-body)">자주찾는 서비스</span></div>
</div>
</body></html>
