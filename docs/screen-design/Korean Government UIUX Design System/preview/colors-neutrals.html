<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Colors — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; }
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .swatch { height: 92px; border-radius: 8px; padding: 10px; display:flex; flex-direction:column; justify-content:space-between; border: 1px solid var(--gov-border-1); font-family: var(--gov-font-body); }
  .swatch .name { font-weight: 700; font-size: 12px; }
  .swatch .hex { font-size: 10px; opacity: 0.85; font-family: var(--gov-font-mono); }
</style></head>
<body>
<div class="row">
  <div class="swatch" style="background:#1D1D1D;color:#fff"><span class="name">fg-1</span><span class="hex">#1D1D1D</span></div>
  <div class="swatch" style="background:#2D2D2D;color:#fff"><span class="name">fg-2</span><span class="hex">#2D2D2D</span></div>
  <div class="swatch" style="background:#555555;color:#fff"><span class="name">fg-3</span><span class="hex">#555555</span></div>
  <div class="swatch" style="background:#8E8E8E;color:#fff"><span class="name">fg-4</span><span class="hex">#8E8E8E</span></div>
  <div class="swatch" style="background:#C6C6C6;color:#1D1D1D"><span class="name">border-3</span><span class="hex">#C6C6C6</span></div>
  <div class="swatch" style="background:#D8D8D8;color:#1D1D1D"><span class="name">border-2</span><span class="hex">#D8D8D8</span></div>
  <div class="swatch" style="background:#E4E4E4;color:#1D1D1D"><span class="name">border-1</span><span class="hex">#E4E4E4</span></div>
  <div class="swatch" style="background:#EDF1F5;color:#1D1D1D"><span class="name">bg-3</span><span class="hex">#EDF1F5</span></div>
  <div class="swatch" style="background:#F0F0F0;color:#1D1D1D"><span class="name">bg-2</span><span class="hex">#F0F0F0</span></div>
  <div class="swatch" style="background:#F8F8F8;color:#1D1D1D"><span class="name">bg-1</span><span class="hex">#F8F8F8</span></div>
  <div class="swatch" style="background:#FFFFFF;color:#1D1D1D"><span class="name">bg-0</span><span class="hex">#FFFFFF</span></div>
  <div class="swatch" style="background:#202020;color:#fff"><span class="name">dark</span><span class="hex">#202020</span></div>
</div>
</body></html>
