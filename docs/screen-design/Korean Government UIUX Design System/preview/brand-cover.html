<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Brand — Cover</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:0; background:#fff; }
  .cover { width: 100%; aspect-ratio: 1600/960; background: var(--gov-cover-indigo); position: relative; overflow: hidden; color: #fff; font-family: var(--gov-font-display); }
  .cover .bg { position:absolute; inset: 0; background: url('../assets/cover-bg.png') center/cover; opacity: 0.7; mix-blend-mode: screen; }
  .cover .label { position:absolute; left: 6%; top: 12%; font-size: 16px; font-weight: 700; }
  .cover .title { position:absolute; left: 6%; top: 32%; font-size: 64px; font-weight: 700; line-height: 1.05; }
</style></head>
<body>
<div class="cover">
  <div class="bg"></div>
  <div class="label">범정부 UI/UX 공통가이드 개발</div>
  <div class="title">표준<br>프로토타입</div>
</div>
</body></html>
