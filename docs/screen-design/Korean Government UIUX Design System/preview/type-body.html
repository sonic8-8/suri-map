<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Type — Body & Labels</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--gov-font-body); color: var(--gov-fg-1); }
  .row { display:flex; flex-direction:column; gap: 12px; }
  .item { display:flex; align-items:baseline; gap: 16px; }
  .tag { font-family: var(--gov-font-mono); font-size: 11px; color: var(--gov-fg-3); width: 130px; flex-shrink: 0; }
</style></head>
<body>
<div class="row">
  <div class="item"><span class="tag">h3 / bold 21</span><span style="font-size:21px;font-weight:700">신청 정보를 입력하세요</span></div>
  <div class="item"><span class="tag">h4 / bold 19</span><span style="font-size:19px;font-weight:700">버튼 라벨</span></div>
  <div class="item"><span class="tag">body-lg / 19</span><span style="font-size:19px">큰 본문 — 입력 필드의 본문</span></div>
  <div class="item"><span class="tag">body / 17</span><span style="font-size:17px">기본 본문 — 본문 텍스트는 17px</span></div>
  <div class="item"><span class="tag">label / 15</span><span style="font-size:15px">라벨 / 힌트 메시지</span></div>
  <div class="item"><span class="tag">caption / 13</span><span style="font-size:13px;color:var(--gov-fg-3)">캡션 또는 보조 정보</span></div>
</div>
</body></html>
