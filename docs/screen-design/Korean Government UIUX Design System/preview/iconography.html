<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--gov-font-body); color: var(--gov-fg-1); }
  .grid { display:grid; grid-template-columns: repeat(8, 1fr); gap: 14px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap: 6px; padding: 10px; border:1px solid var(--gov-border-1); border-radius: 8px; }
  .cell svg { width: 22px; height: 22px; color: var(--gov-fg-1); stroke-width: 1.6; }
  .cell span { font-family: var(--gov-font-mono); font-size: 10px; color: var(--gov-fg-3); }
</style></head>
<body>
<div class="grid">
  <div class="cell"><i data-lucide="search"></i><span>search</span></div>
  <div class="cell"><i data-lucide="x"></i><span>close</span></div>
  <div class="cell"><i data-lucide="home"></i><span>home</span></div>
  <div class="cell"><i data-lucide="log-in"></i><span>login</span></div>
  <div class="cell"><i data-lucide="lock"></i><span>lock</span></div>
  <div class="cell"><i data-lucide="menu"></i><span>menu</span></div>
  <div class="cell"><i data-lucide="heart"></i><span>heart</span></div>
  <div class="cell"><i data-lucide="check"></i><span>check</span></div>
  <div class="cell"><i data-lucide="info"></i><span>info</span></div>
  <div class="cell"><i data-lucide="alert-triangle"></i><span>warn</span></div>
  <div class="cell"><i data-lucide="refresh-cw"></i><span>refresh</span></div>
  <div class="cell"><i data-lucide="filter"></i><span>filter</span></div>
  <div class="cell"><i data-lucide="trash-2"></i><span>delete</span></div>
  <div class="cell"><i data-lucide="external-link"></i><span>external</span></div>
  <div class="cell"><i data-lucide="arrow-up"></i><span>↑</span></div>
  <div class="cell"><i data-lucide="arrow-down"></i><span>↓</span></div>
  <div class="cell"><i data-lucide="arrow-left"></i><span>←</span></div>
  <div class="cell"><i data-lucide="arrow-right"></i><span>→</span></div>
  <div class="cell"><i data-lucide="more-horizontal"></i><span>more</span></div>
  <div class="cell"><i data-lucide="user"></i><span>user</span></div>
  <div class="cell"><i data-lucide="bell"></i><span>bell</span></div>
  <div class="cell"><i data-lucide="settings"></i><span>settings</span></div>
  <div class="cell"><i data-lucide="download"></i><span>download</span></div>
  <div class="cell"><i data-lucide="globe"></i><span>language</span></div>
</div>
<script>lucide.createIcons();</script>
</body></html>
