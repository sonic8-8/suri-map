<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Colors — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .swatch {
    height: 92px; border-radius: 8px; padding: 12px;
    display: flex; flex-direction: column; justify-content: space-between;
    border: 1px solid var(--gov-border-1);
    font-family: var(--gov-font-body);
  }
  .swatch .name { font-weight: 700; font-size: 13px; }
  .swatch .hex { font-size: 11px; opacity: 0.85; font-family: var(--gov-font-mono); }
</style>
</head>
<body>
<div class="row">
  <div class="swatch" style="background:#246BEB;color:#fff;border-color:#246BEB"><span class="name">Primary</span><span class="hex">#246BEB</span></div>
  <div class="swatch" style="background:#1D56BC;color:#fff;border-color:#1D56BC"><span class="name">Hover</span><span class="hex">#1D56BC</span></div>
  <div class="swatch" style="background:#144091;color:#fff;border-color:#144091"><span class="name">Pressed</span><span class="hex">#144091</span></div>
  <div class="swatch" style="background:#D3E1FB;color:#1D56BC"><span class="name">Pastel-strong</span><span class="hex">#D3E1FB</span></div>
  <div class="swatch" style="background:#EFF5FF;color:#246BEB"><span class="name">Pastel</span><span class="hex">#EFF5FF</span></div>
</div>
</body></html>
