<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:24px; background:#fff; font-family: var(--gov-font-body); color: var(--gov-fg-1); }
  .grid { display:grid; grid-template-columns: 80px 1fr 60px; row-gap: 8px; column-gap: 12px; align-items:center; }
  .num { font-family: var(--gov-font-mono); font-size: 11px; color: var(--gov-fg-3); }
  .bar { background: var(--gov-primary); height: 12px; border-radius: 2px; }
  .px { font-size: 12px; color: var(--gov-fg-3); }
</style></head>
<body>
<div class="grid">
  <span class="num">space-1</span><span><span class="bar" style="width:4px"></span></span><span class="px">4px</span>
  <span class="num">space-2</span><span><span class="bar" style="width:8px"></span></span><span class="px">8px</span>
  <span class="num">space-3</span><span><span class="bar" style="width:12px"></span></span><span class="px">12px</span>
  <span class="num">space-4</span><span><span class="bar" style="width:16px"></span></span><span class="px">16px</span>
  <span class="num">space-5</span><span><span class="bar" style="width:20px"></span></span><span class="px">20px</span>
  <span class="num">space-6</span><span><span class="bar" style="width:24px"></span></span><span class="px">24px</span>
  <span class="num">space-10</span><span><span class="bar" style="width:40px"></span></span><span class="px">40px</span>
  <span class="num">space-14</span><span><span class="bar" style="width:56px"></span></span><span class="px">56px</span>
  <span class="num">space-20</span><span><span class="bar" style="width:80px"></span></span><span class="px">80px</span>
</div>
</body></html>
