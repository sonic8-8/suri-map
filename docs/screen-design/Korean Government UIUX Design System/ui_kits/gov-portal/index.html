<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>정부24 — Government Portal</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="Header.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="EmergencyNotice.jsx"></script>
  <script type="text/babel" src="HeroSearch.jsx"></script>
  <script type="text/babel" src="QuickServices.jsx"></script>
  <script type="text/babel" src="NewsSection.jsx"></script>
  <script type="text/babel" src="ApplyDetail.jsx"></script>
  <script type="text/babel" src="ApplyDone.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [screen, setScreen] = useState("home");
      const [picked, setPicked] = useState(null);

      useEffect(() => { lucide.createIcons(); });

      const goHome = () => { setScreen("home"); setPicked(null); };
      const pickService = (svc) => { setPicked(svc); setScreen("detail"); };
      const submit = () => setScreen("done");

      return (
        <div className="app" data-screen-label={
          screen === "home" ? "01 Home" : screen === "detail" ? "02 Apply Detail" : "03 Apply Done"
        }>
          <Header onNavHome={goHome} />
          {screen === "home" && (
            <main>
              <EmergencyNotice />
              <HeroSearch />
              <QuickServices onPick={pickService} />
              <NewsSection />
            </main>
          )}
          {screen === "detail" && picked && (
            <ApplyDetail service={picked} onBack={goHome} onSubmit={submit} />
          )}
          {screen === "done" && picked && (
            <ApplyDone service={picked} onHome={goHome} />
          )}
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
