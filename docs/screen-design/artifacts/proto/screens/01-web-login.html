<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Step 1 · Web 로그인</title>
<script src="../state.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  html, body { height: 100%; }
  body { background: #f8f8f8; display: flex; align-items: center; justify-content: center; }

  .login-card { background: #fff; border: 1px solid #d8d8d8; padding: 48px 40px; width: 400px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .logo { text-align: center; margin-bottom: 32px; }
  .logo-circle { width: 56px; height: 56px; border: 2px solid #246BEB; border-radius: 50%; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #246BEB; font-size: 14px; }
  .logo .title { font-size: 19px; font-weight: 700; color: #1d1d1d; }
  .logo .subtitle { font-size: 12px; color: #666; margin-top: 4px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; font-weight: 500; color: #555; margin-bottom: 6px; }
  .field input { width: 100%; padding: 12px 14px; border: 1px solid #717171; border-radius: 8px; font-size: 14px; font-family: inherit; }
  .field input:focus { outline: 2px solid #246BEB; outline-offset: -1px; border-color: #246BEB; }

  .login-btn { width: 100%; padding: 14px; background: #246BEB; color: #fff; border: 0; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; margin-top: 8px; }
  .login-btn:hover { background: #1D56BC; }
  .login-btn:disabled { background: #d8d8d8; cursor: not-allowed; }

  .help { font-size: 12px; color: #8E8E8E; text-align: center; margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee; }

  .error { color: #D63A3A; font-size: 12px; margin-top: 8px; display: none; }

  /* 시연용 hint */
  .demo-hint { position: fixed; bottom: 16px; left: 16px; right: 16px; max-width: 440px; margin: 0 auto; background: #FCF1E2; border: 1px solid #E8881A; padding: 10px 14px; font-size: 12px; border-radius: 6px; }
  .demo-hint b { color: #E8881A; }
</style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <div class="logo-circle">SM</div>
    <div class="title">Suri-Map</div>
    <div class="subtitle">경찰 실종 수색 운영 보조</div>
  </div>

  <form id="loginForm" onsubmit="onLogin(event)">
    <div class="field">
      <label>아이디</label>
      <input type="text" id="username" value="missing-team-commander" autocomplete="off">
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="password" value="••••••••">
    </div>
    <button type="submit" class="login-btn">로그인</button>
    <div class="error" id="error">아이디 또는 비밀번호가 올바르지 않습니다.</div>
  </form>

  <div class="help">
    계정 발급은 IT 부서로 문의하세요.
  </div>
</div>

<div class="demo-hint">
  <b>시연 가이드:</b> 미리 입력된 실종팀 간부 계정으로 [로그인] 클릭. 자동으로 다음 화면으로 이동합니다.
</div>

<script>
  renderProtoBar(1, 7, null);

  function onLogin(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    if (!username) {
      document.getElementById('error').style.display = 'block';
      return;
    }
    updateState({
      step: 1,
      loggedIn: true,
      account: { id: 'mt-1', name: '김 간부', org: '실종팀', role: 'MISSING_TEAM_COMMANDER' }
    });
    goToNext('./02-web-incident-list.html');
  }
</script>
</body>
</html>
