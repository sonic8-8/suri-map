<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Step 4 · Polifon 사건 선택</title>
<script src="../state.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  html, body { height: 100%; }
  body { background: #999; display: flex; align-items: center; justify-content: center; padding: 20px; }

  .device { width: 412px; height: 892px; background: #0B0F19; color: #fff; display: grid; grid-template-rows: 32px 1fr 24px; overflow: hidden; border-radius: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }

  .status-bar { padding: 0 16px; display: flex; align-items: center; font-size: 12px; font-weight: 600; color: #E5E7EB; gap: 8px; }
  .status-bar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 11px; }

  .content { display: flex; flex-direction: column; overflow: hidden; }
  .header { padding: 16px 20px; border-bottom: 1px solid #2A3240; }
  .header .title { font-size: 19px; font-weight: 800; color: #fff; }
  .header .sub { font-size: 12px; color: #9CA3AF; margin-top: 4px; }

  .list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .card { background: #111827; border: 1px solid #2A3240; border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.15s; min-height: 100px; }
  .card:hover { border-color: #22D3EE; }
  .card .name { font-size: 17px; font-weight: 700; color: #fff; }
  .card .location { font-size: 13px; color: #9CA3AF; margin: 4px 0 12px; }
  .card .status-row { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px solid #2A3240; }
  .card .status { font-size: 12px; color: #22C55E; font-weight: 600; }
  .card .updated { font-size: 11px; color: #9CA3AF; }

  .empty { padding: 48px 24px; text-align: center; color: #9CA3AF; font-size: 14px; line-height: 1.6; }

  .gesture { display: flex; align-items: center; justify-content: center; }
  .gesture .pill { width: 130px; height: 4px; background: #6B7280; border-radius: 2px; }

  .hint { background: #FCBA04; color: #0B0F19; padding: 8px 12px; font-size: 11px; font-weight: 600; text-align: center; }
</style>
</head>
<body>

<div class="device">
  <div class="status-bar">
    <span>14:31</span>
    <div class="right">
      <span>▮▮▮</span>
      <span>LTE</span>
      <span>78%</span>
    </div>
  </div>

  <div class="content">
    <div class="header">
      <div class="title">사건 선택</div>
      <div class="sub" id="userInfo">기동대 1부대 A팀 · 김OO 대원</div>
    </div>
    <div class="hint">↓ 풀다운 새로고침</div>
    <div class="list" id="list"></div>
  </div>

  <div class="gesture"><div class="pill"></div></div>
</div>

<script>
  renderProtoBar(4, 7, './05-polifon-package-download.html');

  function render() {
    const s = getState();
    const list = document.getElementById('list');
    const incidents = s.importedIncidents || [];
    if (incidents.length === 0) {
      list.innerHTML = '<div class="empty">현재 배정된 사건이 없습니다.<br><br>실종팀이 사건을 가져오면<br>이곳에 표시됩니다.</div>';
    } else {
      list.innerHTML = incidents.map(inc => `
        <div class="card" onclick="enterIncident('${inc.id}')">
          <div class="name">${inc.missing}</div>
          <div class="location">${inc.location}</div>
          <div class="status-row">
            <span class="status">진행 중 · OP 1차</span>
            <span class="updated">14:30 갱신</span>
          </div>
        </div>
      `).join('');
    }
  }

  function enterIncident(id) {
    const s = getState();
    s.activeIncidentId = id;
    s.step = 4;
    saveState(s);
    location.href = './05-polifon-package-download.html';
  }

  render();
</script>
</body>
</html>
