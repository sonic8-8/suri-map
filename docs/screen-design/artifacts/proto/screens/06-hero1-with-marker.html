<!DOCTYPE html>

<head>

<title>Step 6 · Hero 1 사건 상황판 (마커 반영 확인)</title>
<script src="../state.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; margin: 0; }
  body { font-family: Pretendard, sans-serif; }
  .frame { width: 100%; height: 100vh; border: 0; display: block; }

  .overlay { position: fixed; top: 60px; right: 16px; background: rgba(11,15,25,0.95); color: #fff; border: 1px solid #22C55E; padding: 16px 18px; border-radius: 8px; max-width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,0.3); z-index: 9999; font-family: Pretendard, sans-serif; }
  .overlay .badge { display: inline-block; padding: 2px 8px; background: #22C55E; color: #0B0F19; font-size: 10px; font-weight: 800; border-radius: 4px; margin-bottom: 8px; letter-spacing: 0.5px; }

  .marker-popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fff; border: 2px solid #D63A3A; padding: 20px 24px; border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,0.3); z-index: 10000; max-width: 380px; font-family: Pretendard, sans-serif; }

  .marker-popup .meta b { color: #D63A3A; }
  .marker-popup .ack-btn { width: 100%; padding: 12px; background: #1d1d1d; color: #fff; border: 0; border-radius: 6px; font-family: inherit; font-weight: 700; cursor: pointer; }

</head>
