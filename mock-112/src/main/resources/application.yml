spring:
  application:
    name: mock-112
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:mock112;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:18112}

logging:
  level:
    com.mock112: DEBUG

suri-map:
  webhook:
    enabled: ${SURI_MAP_WEBHOOK_ENABLED:false}
    url: ${SURI_MAP_WEBHOOK_URL:http://backend:8080/api/internal/mock-112/events}
    secret: ${SURI_MAP_WEBHOOK_SECRET:}
