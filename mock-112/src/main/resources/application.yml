spring:
  application:
    name: mock-112
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:18112}

logging:
  level:
    com.mock112: DEBUG

suri-map:
  webhook:
    enabled: ${SURI_MAP_WEBHOOK_ENABLED:false}
    url: ${SURI_MAP_WEBHOOK_URL:http://backend:8080/api/internal/mock-112/events}
    secret: ${SURI_MAP_WEBHOOK_SECRET:}
