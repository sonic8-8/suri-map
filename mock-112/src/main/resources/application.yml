spring:
  application:
    name: mock-112
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:mock112;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MOCK112_PHOTO_MAX_SIZE:10MB}
      max-request-size: ${MOCK112_PHOTO_MAX_SIZE:10MB}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${MOCK112_KEYCLOAK_CLIENT_ID:suri-map-mock112}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/mock-112/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
        provider:
          keycloak:
            authorization-uri: ${MOCK112_KEYCLOAK_AUTHORIZATION_URI:http://localhost:18080/keycloak/realms/suri-map/protocol/openid-connect/auth}
            token-uri: ${MOCK112_KEYCLOAK_TOKEN_URI:http://localhost:18080/keycloak/realms/suri-map/protocol/openid-connect/token}
            jwk-set-uri: ${MOCK112_KEYCLOAK_JWK_SET_URI:http://localhost:18080/keycloak/realms/suri-map/protocol/openid-connect/certs}
            user-info-uri: ${MOCK112_KEYCLOAK_USER_INFO_URI:http://localhost:18080/keycloak/realms/suri-map/protocol/openid-connect/userinfo}
            user-name-attribute: preferred_username

server:
  port: ${SERVER_PORT:18112}
  forward-headers-strategy: framework

logging:
  level:
    com.mock112: DEBUG

suri-map:
  webhook:
    enabled: ${SURI_MAP_WEBHOOK_ENABLED:false}
    url: ${SURI_MAP_WEBHOOK_URL:http://backend:8080/api/internal/mock-112/events}
    secret: ${SURI_MAP_WEBHOOK_SECRET:${MOCK112_WEBHOOK_SECRET:}}
    retry-delay-ms: ${SURI_MAP_WEBHOOK_RETRY_DELAY_MS:5000}
    retry-batch-size: ${SURI_MAP_WEBHOOK_RETRY_BATCH_SIZE:20}
    max-attempts: ${SURI_MAP_WEBHOOK_MAX_ATTEMPTS:5}

mock112:
  internal-api:
    token: ${MOCK112_INTERNAL_API_TOKEN:}
  object-storage:
    provider: ${MOCK112_OBJECT_STORAGE_PROVIDER:${SURI_MAP_OBJECT_STORAGE_PROVIDER:mock}}
    endpoint: ${MOCK112_OBJECT_STORAGE_ENDPOINT:${SURI_MAP_OBJECT_STORAGE_ENDPOINT:http://localhost:9000}}
    public-endpoint: ${MOCK112_OBJECT_STORAGE_PUBLIC_ENDPOINT:${SURI_MAP_OBJECT_STORAGE_PUBLIC_ENDPOINT:}}
    bucket: ${MOCK112_OBJECT_STORAGE_BUCKET:${SURI_MAP_OBJECT_STORAGE_BUCKET:suri-map-photo}}
    access-key: ${MOCK112_OBJECT_STORAGE_ACCESS_KEY:${SURI_MAP_OBJECT_STORAGE_ACCESS_KEY:minioadmin}}
    secret-key: ${MOCK112_OBJECT_STORAGE_SECRET_KEY:${SURI_MAP_OBJECT_STORAGE_SECRET_KEY:minioadmin}}
    region: ${MOCK112_OBJECT_STORAGE_REGION:${SURI_MAP_OBJECT_STORAGE_REGION:us-east-1}}
