name: suri-map-runtime

services:
  frontend:
    image: ${FRONTEND_IMAGE:-suri-map-frontend:develop}
    container_name: suri-map-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_TILE_BASE_URL: ${VITE_TILE_BASE_URL:-/tiles}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    networks:
      - web_net

  tileserver-gl:
    image: ${TILESERVER_IMAGE:-maptiler/tileserver-gl:latest}
    container_name: suri-map-tileserver-gl
    restart: unless-stopped
    command: ["--config", "/data/config.json"]
    ports:
      - "127.0.0.1:${TILESERVER_HOST_PORT:-8082}:8080"
    volumes:
      - ${TILESERVER_DATA_DIR:-./tileserver}:/data:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:8080/styles/osm-local/style.json', r => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - web_net

  backend:
    image: ${BACKEND_IMAGE:-suri-map-backend:develop}
    container_name: suri-map-backend
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      TILESERVER_MODE: ${TILESERVER_MODE:-tileserver-gl}
      TILESERVER_BASE_URL: ${TILESERVER_BASE_URL:-http://tileserver-gl:8080}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8081}:8080"
    networks:
      - web_net
      - db_net

  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: suri-map-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - suri_map_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - db_net

volumes:
  suri_map_postgis_data:

networks:
  web_net:
  db_net:
    internal: true
