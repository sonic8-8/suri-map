name: suri-map-runtime

services:
  frontend:
    image: ${FRONTEND_IMAGE:-suri-map-frontend:develop}
    container_name: suri-map-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_TILE_BASE_URL: ${VITE_TILE_BASE_URL:-/tiles}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    networks:
      - web_net

  tileserver-gl:
    image: ${TILESERVER_IMAGE:-maptiler/tileserver-gl:latest}
    container_name: suri-map-tileserver-gl
    restart: unless-stopped
    command: ["--config", "/data/config.json"]
    ports:
      - "127.0.0.1:${TILESERVER_HOST_PORT:-8082}:8080"
    volumes:
      - ${TILESERVER_DATA_DIR:-./tileserver}:/data:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:8080/styles/osm-local/style.json', r => process.exit(r.statusCode >= 200 && r.statusCode < 400 ? 0 : 1)).on('error', () => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - web_net

  mock-112:
    image: ${MOCK_112_IMAGE:-suri-map-mock-112:develop}
    container_name: suri-map-mock-112
    restart: unless-stopped
    depends_on:
      mock112-postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 18112
      TZ: Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:postgresql://mock112-postgres:5432/${MOCK112_POSTGRES_DB:-mock112}
      SPRING_DATASOURCE_USERNAME: ${MOCK112_POSTGRES_USER:-mock112}
      SPRING_DATASOURCE_PASSWORD: ${MOCK112_POSTGRES_PASSWORD:-mock112}
      SURI_MAP_WEBHOOK_ENABLED: ${SURI_MAP_WEBHOOK_ENABLED:-true}
      SURI_MAP_WEBHOOK_URL: ${SURI_MAP_WEBHOOK_URL:-http://backend:8080/api/internal/mock-112/events}
      SURI_MAP_WEBHOOK_SECRET: ${MOCK_112_WEBHOOK_SECRET:-}
    ports:
      - "127.0.0.1:${MOCK_112_HOST_PORT:-18112}:18112"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:18112/mock-112/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - web_net
      - db_net

  backend:
    image: ${BACKEND_IMAGE:-suri-map-backend:develop}
    container_name: suri-map-backend
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      mock-112:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      TILESERVER_MODE: ${TILESERVER_MODE:-tileserver-gl}
      TILESERVER_BASE_URL: ${TILESERVER_BASE_URL:-http://tileserver-gl:8080}
      MOCK_112_ENABLED: ${MOCK_112_ENABLED:-true}
      MOCK_112_BASE_URL: ${MOCK_112_BASE_URL:-http://mock-112:18112}
      MOCK_112_POLLING_INTERVAL: ${MOCK_112_POLLING_INTERVAL:-5000}
      MOCK_112_WEBHOOK_SECRET: ${MOCK_112_WEBHOOK_SECRET:-}
      FCM_PROVIDER: ${FCM_PROVIDER:-mock}
      FIREBASE_CREDENTIALS_LOCATION: ${FIREBASE_CREDENTIALS_LOCATION:-}
      FIREBASE_CREDENTIALS_JSON_BASE64: ${FIREBASE_CREDENTIALS_JSON_BASE64:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_FCM_DRY_RUN: ${FIREBASE_FCM_DRY_RUN:-false}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8081}:8080"
    networks:
      - web_net
      - db_net

  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: suri-map-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - suri_map_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - db_net

  mock112-postgres:
    image: postgres:16-alpine
    container_name: suri-map-mock112-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MOCK112_POSTGRES_DB:-mock112}
      POSTGRES_USER: ${MOCK112_POSTGRES_USER:-mock112}
      POSTGRES_PASSWORD: ${MOCK112_POSTGRES_PASSWORD:-mock112}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${MOCK112_POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - suri_map_mock112_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOCK112_POSTGRES_USER:-mock112} -d ${MOCK112_POSTGRES_DB:-mock112}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - db_net

volumes:
  suri_map_postgis_data:
  suri_map_mock112_postgres_data:

networks:
  web_net:
  db_net:
    internal: true
