name: suri-map-backend-runtime

services:
  backend:
    image: ${BACKEND_IMAGE:-suri-map-backend:develop}
    container_name: suri-map-backend
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Seoul
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgis:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      FCM_PROVIDER: ${FCM_PROVIDER:-mock}
      FIREBASE_CREDENTIALS_LOCATION: ${FIREBASE_CREDENTIALS_LOCATION:-}
      FIREBASE_CREDENTIALS_JSON_BASE64: ${FIREBASE_CREDENTIALS_JSON_BASE64:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_FCM_DRY_RUN: ${FIREBASE_FCM_DRY_RUN:-false}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8081}:8080"
    networks:
      - web_net
      - db_net

  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: suri-map-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - suri_map_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - db_net

volumes:
  suri_map_postgis_data:

networks:
  web_net:
  db_net:
    internal: true
