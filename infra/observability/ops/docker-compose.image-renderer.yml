services:
  grafana:
    environment:
      GF_RENDERING_SERVER_URL: http://grafana-image-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDERER_TOKEN:?set GRAFANA_RENDERER_TOKEN}

  grafana-image-renderer:
    image: grafana/grafana-image-renderer@sha256:cafd7afe8cc1995f26434e0194fadd823656b322cb7c8c2784e1477c72ff9e46
    profiles:
      - render
    restart: "no"
    environment:
      AUTH_TOKEN: ${GRAFANA_RENDERER_TOKEN:?set GRAFANA_RENDERER_TOKEN}
      GOMEMLIMIT: 1GiB
    cpus: 2.0
    mem_limit: 2g
    networks:
      - ops
