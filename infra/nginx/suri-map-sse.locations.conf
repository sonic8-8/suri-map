    # BEGIN Suri-Map SSE proxy
    # SSE endpoints must bypass nginx response buffering and keep the upstream
    # connection open. Without this, browser fetch streams can fail with HTTP/2
    # protocol errors even when the backend emits text/event-stream correctly.
    location = /api/incidents/events {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Client-Channel $http_x_client_channel;
        proxy_set_header Last-Event-ID $http_last_event_id;
        add_header Cache-Control no-cache always;
        add_header X-Accel-Buffering no always;
    }

    location ~ ^/api/incidents/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Client-Channel $http_x_client_channel;
        proxy_set_header Last-Event-ID $http_last_event_id;
        add_header Cache-Control no-cache always;
        add_header X-Accel-Buffering no always;
    }
    # END Suri-Map SSE proxy
