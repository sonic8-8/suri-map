# Include these locations inside the EC2 host nginx HTTPS server block.
# They preserve the public Suri-Map /tiles contract by proxying to the
# authenticated backend tile controller. The backend then fetches real tile
# blobs from tileserver-gl on the Docker network.

location = /tiles {
    return 308 /tiles/;
}

location /tiles/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Client-Channel $http_x_client_channel;
    proxy_set_header X-PolicePhone-Id $http_x_policephone_id;
}
