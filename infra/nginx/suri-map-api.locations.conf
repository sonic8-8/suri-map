# Include only in the Hetzner suri-map.sonic8-8.com HTTPS server block.
# Keep API errors out of the website's placeholder-page fallback.
# Regex locations are matched in order: SSE must precede the general API route.
location ~ ^/api/incidents/(?:[^/]+/)?events$ {
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_intercept_errors off;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    # Match the existing Frontend proxy timeout; this is not a delivery SLA.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
}

location ~ ^/api(?:/|$) {
    proxy_pass http://127.0.0.1:18081;
    proxy_http_version 1.1;
    proxy_intercept_errors off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
}
