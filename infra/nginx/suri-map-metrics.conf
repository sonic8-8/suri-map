server {
    listen 10.0.0.2:19091;
    server_name _;

    access_log off;

    allow 10.0.0.3;
    deny all;

    location = /metrics {
        proxy_pass http://127.0.0.1:18091/actuator/prometheus;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location / {
        return 404;
    }
}
