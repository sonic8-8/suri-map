services:
  frontend:
    image: node:22-alpine
    container_name: surimap-frontend
    working_dir: /workspace/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
      VITE_KEYCLOAK_BASE_URL: ${VITE_KEYCLOAK_BASE_URL:-http://localhost:18080/keycloak}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-suri-map-web}
      VITE_KEYCLOAK_ISSUER_URL: ${VITE_KEYCLOAK_ISSUER_URL:-/keycloak/realms/suri-map}
      VITE_TILE_BASE_URL: ${VITE_TILE_BASE_URL:-http://localhost:8082}
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/workspace/frontend
      - surimap-frontend-node-modules:/workspace/frontend/node_modules

  tileserver-gl:
    image: maptiler/tileserver-gl:latest
    container_name: surimap-tileserver-gl
    ports:
      - "8082:8080"

  postgres:
    image: postgis/postgis:16-3.5
    container_name: surimap-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-surimap}
      POSTGRES_USER: ${POSTGRES_USER:-surimap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-surimap}
    ports:
      - "5432:5432"
    volumes:
      - surimap-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-surimap} -d ${POSTGRES_DB:-surimap}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mock112-postgres:
    image: postgres:16-alpine
    container_name: mock112-postgres
    environment:
      POSTGRES_DB: ${MOCK112_POSTGRES_DB:-mock112}
      POSTGRES_USER: ${MOCK112_POSTGRES_USER:-mock112}
      POSTGRES_PASSWORD: ${MOCK112_POSTGRES_PASSWORD:-mock112}
    ports:
      - "${MOCK112_POSTGRES_HOST_PORT:-15433}:5432"
    volumes:
      - mock112-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${MOCK112_POSTGRES_USER:-mock112} -d ${MOCK112_POSTGRES_DB:-mock112}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-112:
    build: ../mock-112
    container_name: mock-112
    depends_on:
      mock112-postgres:
        condition: service_healthy
    ports:
      - "${MOCK_112_HOST_PORT:-18112}:18112"
    environment:
      SERVER_PORT: 18112
      SPRING_DATASOURCE_URL: jdbc:postgresql://mock112-postgres:5432/${MOCK112_POSTGRES_DB:-mock112}
      SPRING_DATASOURCE_USERNAME: ${MOCK112_POSTGRES_USER:-mock112}
      SPRING_DATASOURCE_PASSWORD: ${MOCK112_POSTGRES_PASSWORD:-mock112}
      SURI_MAP_WEBHOOK_ENABLED: "true"
      SURI_MAP_WEBHOOK_URL: http://backend:8080/api/internal/mock-112/events
      SURI_MAP_WEBHOOK_SECRET: ${MOCK112_WEBHOOK_SECRET:-}
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:18112/mock-112/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  keycloak-postgres:
    image: postgres:16-alpine
    container_name: keycloak-postgres
    environment:
      POSTGRES_DB: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak}
    ports:
      - "${KEYCLOAK_POSTGRES_HOST_PORT:-15434}:5432"
    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${KEYCLOAK_POSTGRES_USER:-keycloak} -d ${KEYCLOAK_POSTGRES_DB:-keycloak}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.6.1}
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: ${KEYCLOAK_POSTGRES_DB:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_POSTGRES_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_POSTGRES_PASSWORD:-keycloak}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /keycloak
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "${KEYCLOAK_HOST_PORT:-18080}:8080"
      - "${KEYCLOAK_MANAGEMENT_HOST_PORT:-19000}:9000"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro

volumes:
  surimap-frontend-node-modules:
  surimap-postgres-data:
  mock112-postgres-data:
  keycloak-postgres-data:
